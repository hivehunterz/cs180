<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tan Ee Khai — CS180</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e2e2e2;
  --accent: #003262;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151719;
    --text: #e8e6e3;
    --muted: #9a9894;
    --border: #303336;
    --accent: #7fb3e8;
  }
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.6;
}
.wrap { max-width: 780px; margin: 0 auto; padding: 64px 24px 80px; }
h1 { font-size: 2rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin: 0 0 48px; }
h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 16px; }
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 14px 0; border-top: 1px solid var(--border); }
li:last-child { border-bottom: 1px solid var(--border); }
a { color: var(--accent); text-underline-offset: 2px; }
li span { display: block; color: var(--muted); font-size: 0.92rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tan Ee Khai</h1>

  <h2>Projects</h2>
